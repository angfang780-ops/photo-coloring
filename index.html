<!doctype html>
<html lang="ko">
<head>
<title>사진 색칠하기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="색칠하기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1F2A3C;
    --felt-deep:#151D2B;
    --bar:#101724;
    --ink:#ECE5D3;
    --ink-dim:#A3AEC2;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 화면이 세로면 게임 화면 전체를 90도 돌려 세로 화면을 꽉 채운다 — 태블릿을 옆으로 돌려 들면 가로 화면처럼 보임 (자동회전 꺼도 됨) */
  @media (orientation:portrait){
    .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible,.vh:focus-visible + label{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .btn:disabled{opacity:.35;cursor:default}
  .seg{display:flex;align-items:center;gap:6px}
  .seg .btn{flex:1 1 0;min-width:0;padding:0 4px;font-size:18px}
  .seg .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .stage{position:absolute;inset:0;background:var(--felt)}
  #board{position:absolute;left:0;top:0;display:block;touch-action:none}
  /* 오른쪽 물감판 */
  .pal{
    position:absolute;top:0;right:0;bottom:0;width:var(--pw);display:flex;flex-direction:column;gap:10px;
    padding:12px;background:var(--bar);border-left:1px solid var(--line);overflow:hidden
  }
  .gear{min-height:54px;font-size:20px;font-weight:700;background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1 1 auto;min-height:0;align-content:start}
  .sw button{
    aspect-ratio:1;min-height:0;border-radius:50%;border:3px solid rgba(0,0,0,.3);cursor:pointer;touch-action:manipulation;padding:0;
    box-shadow:0 3px 8px rgba(0,0,0,.35)
  }
  .sw button[aria-pressed="true"]{border:5px solid #fff;box-shadow:0 0 0 4px var(--brass)}
  .sw .photo{background:conic-gradient(#E53935,#FDD835,#7CB342,#4FC3F7,#8E44AD,#E53935)}
  .sw .eraser{background:#fff;color:#555;font-size:13px;font-weight:700}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tools .btn{min-height:52px;font-size:17px;padding:0 6px}
  .pct{text-align:center;color:var(--ink-dim);font-size:15px}
  .pct b{color:var(--brass);font-size:18px}
  .peek{
    position:absolute;left:14px;top:14px;width:min(32%,320px);border:4px solid var(--ink);border-radius:4px;background:var(--ink);
    box-shadow:0 12px 30px rgba(0,0,0,.45);pointer-events:none
  }
  .peek canvas{display:block;width:100%;height:auto}
  .busy{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700;background:rgba(8,12,20,.5);z-index:2}
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,12,20,.55);overflow:auto;z-index:3}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
  .toast{
    position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:calc(100% - 32px);z-index:4;
    padding:12px 18px;border-radius:12px;background:#3A1E18;border:1px solid #9C4A38;color:#FFE4DB;font-size:17px
  }
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="board" role="img" aria-label="색칠할 그림"></canvas>
    <div class="peek" id="peekBox" hidden><canvas id="pv"></canvas></div>
    <aside class="pal" id="pal">
      <button id="gear" class="btn gear" type="button">설정</button>
      <div class="sw" id="sw" role="group" aria-label="물감"></div>
      <div class="pct">칠한 곳 <b id="pct">0%</b></div>
      <div class="tools">
        <button id="undo" class="btn" type="button">되돌리기</button>
        <button id="peek" class="btn" type="button" aria-pressed="false">원래 사진</button>
      </div>
    </aside>
    <div class="busy" id="busy" hidden>그림 만드는 중…</div>
    <div class="toast" id="toast" hidden></div>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <input id="file" class="vh" type="file" accept="image/*">
          <label for="file" class="btn primary wide">사진 고르기</label>
          <button id="next" class="btn wide" type="button">다른 사진으로</button>
          <div id="level" class="seg wide" role="group" aria-label="칸 수">
            <button class="btn" type="button" data-v="1" aria-pressed="true">칸 적게</button>
            <button class="btn" type="button" data-v="2" aria-pressed="false">보통</button>
            <button class="btn" type="button" data-v="3" aria-pressed="false">칸 많이</button>
          </div>
          <button id="clear" class="btn" type="button">처음부터</button>
          <button id="save" class="btn" type="button">그림 저장</button>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="full" class="btn" type="button">전체 화면</button>
        </div>
        <p class="note">물감을 고르고 칸을 누르면 칠해져요. 무지개 동그라미는 원래 사진 색으로 칠해요. 「다른 사진으로」는 사진 퍼즐·숨은그림 등에 넣어 둔 사진에서 골라요.</p>
        <button id="menuClose" class="btn primary" type="button">닫고 칠하기</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#board'), ctx = cv.getContext('2d'), stage = $('#stage');
  const turned = matchMedia('(orientation: portrait)');
  const KEY = 'color.v1', PREFS = 'color.prefs';
  const COLORS = ['#E53935','#FB8C00','#FDD835','#7CB342','#2E7D32','#4FC3F7','#1E63C8','#8E44AD','#F48FB1','#8D6E63','#FFCCBC','#9E9E9E'];
  // 칸 수: 색 무리 수, 흐리게 하는 정도, 작은 칸을 이웃에 합치는 크기
  const LEVELS = { 1: { k: 6, blur: 4, min: .0016 }, 2: { k: 9, blur: 3, min: .0008 }, 3: { k: 13, blur: 2, min: .0004 } };
  const WORK = 900;

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
  };
  let prefs = { level: 1, sound: true };
  try { Object.assign(prefs, JSON.parse(store.get(PREFS) || '{}')); } catch(e){}
  const savePrefs = () => store.set(PREFS, JSON.stringify(prefs));

  let P = null;      // 지금 그림
  let brush = COLORS[0];

  // ---------- 사진 → 색칠 그림 ----------
  function seeded(s){ return () => (s = (s*16807) % 2147483647) / 2147483647; }
  function build(img, level, dataURL, saved){
    const L = LEVELS[level], w = img.width, h = img.height, N = w*h;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const orig = g.getImageData(0, 0, w, h).data;
    g.filter = `blur(${L.blur}px)`; g.drawImage(img, 0, 0); g.filter = 'none';
    const px = g.getImageData(0, 0, w, h).data;
    // 1) 비슷한 색끼리 무리 짓기 (같은 사진이면 늘 같은 결과가 나오게 정해진 난수)
    const rnd = seeded(12345), K = L.k, cen = [];
    for (let i = 0; i < K; i++){ const p = Math.floor(rnd()*N)*4; cen.push([px[p], px[p+1], px[p+2]]); }
    const step = Math.max(1, Math.floor(N/40000));
    for (let it = 0; it < 10; it++){
      const sum = cen.map(() => [0, 0, 0, 0]);
      for (let i = 0; i < N; i += step){
        const p = i*4; let bi = 0, bd = Infinity;
        for (let j = 0; j < K; j++){ const d = (px[p]-cen[j][0])**2 + (px[p+1]-cen[j][1])**2 + (px[p+2]-cen[j][2])**2; if (d < bd){ bd = d; bi = j; } }
        const s = sum[bi]; s[0] += px[p]; s[1] += px[p+1]; s[2] += px[p+2]; s[3]++;
      }
      sum.forEach((s, j) => { if (s[3]) cen[j] = [s[0]/s[3], s[1]/s[3], s[2]/s[3]]; });
    }
    let lab = new Uint8Array(N);
    for (let i = 0; i < N; i++){
      const p = i*4; let bi = 0, bd = Infinity;
      for (let j = 0; j < K; j++){ const d = (px[p]-cen[j][0])**2 + (px[p+1]-cen[j][1])**2 + (px[p+2]-cen[j][2])**2; if (d < bd){ bd = d; bi = j; } }
      lab[i] = bi;
    }
    // 2) 점처럼 튀는 곳 정리 (주변 3×3에서 가장 많은 무리로)
    for (let pass = 0; pass < 2; pass++){
      const nl = new Uint8Array(N), cnt = new Uint16Array(K);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
        cnt.fill(0);
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
          const xx = Math.min(w-1, Math.max(0, x+dx)), yy = Math.min(h-1, Math.max(0, y+dy)); cnt[lab[yy*w + xx]]++;
        }
        let bi = lab[y*w + x], bc = 0; for (let j = 0; j < K; j++) if (cnt[j] > bc){ bc = cnt[j]; bi = j; }
        nl[y*w + x] = bi;
      }
      lab = nl;
    }
    // 3) 이어진 곳마다 칸 번호
    const comp = new Int32Array(N).fill(-1); let nc = 0;
    const stack = new Int32Array(N);
    for (let i = 0; i < N; i++){
      if (comp[i] >= 0) continue;
      let sp = 0; stack[sp++] = i; comp[i] = nc;
      while (sp){
        const q = stack[--sp], x = q % w, y = (q - x)/w, l = lab[q];
        if (x > 0 && comp[q-1] < 0 && lab[q-1] === l){ comp[q-1] = nc; stack[sp++] = q-1; }
        if (x < w-1 && comp[q+1] < 0 && lab[q+1] === l){ comp[q+1] = nc; stack[sp++] = q+1; }
        if (y > 0 && comp[q-w] < 0 && lab[q-w] === l){ comp[q-w] = nc; stack[sp++] = q-w; }
        if (y < h-1 && comp[q+w] < 0 && lab[q+w] === l){ comp[q+w] = nc; stack[sp++] = q+w; }
      }
      nc++;
    }
    // 4) 너무 작은 칸은 가장 많이 맞닿은 이웃 칸에 합친다
    const size = new Int32Array(nc); for (let i = 0; i < N; i++) size[comp[i]]++;
    const minA = Math.max(30, N*L.min), parent = new Int32Array(nc).map((_, i) => i);
    const find = a => { while (parent[a] !== a) a = parent[a] = parent[parent[a]]; return a; };
    for (let round = 0; round < 3; round++){
      const nb = new Map();
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
        const i = y*w + x, a = find(comp[i]);
        for (const j of [x < w-1 ? i+1 : -1, y < h-1 ? i+w : -1]){
          if (j < 0) continue;
          const b = find(comp[j]); if (a === b) continue;
          for (const [s, t] of [[a, b], [b, a]]){
            if (size[s] >= minA) continue;
            let m = nb.get(s); if (!m){ m = new Map(); nb.set(s, m); } m.set(t, (m.get(t) || 0) + 1);
          }
        }
      }
      if (!nb.size) break;
      for (const [s, m] of nb){
        const a = find(s); if (size[a] >= minA) continue;
        let bt = -1, bc = 0; for (const [t, c2] of m){ const tt = find(t); if (tt !== a && c2 > bc){ bc = c2; bt = tt; } }
        if (bt >= 0){ parent[a] = bt; size[bt] += size[a]; }
      }
    }
    // 번호 다시 매기기
    const remap = new Int32Array(nc).fill(-1); let n2 = 0;
    for (let i = 0; i < N; i++){ const r = find(comp[i]); if (remap[r] < 0) remap[r] = n2++; comp[i] = remap[r]; }
    // 칸별 픽셀 목록 · 원래 사진 평균 색 · 테두리
    const cnt2 = new Int32Array(n2 + 1); for (let i = 0; i < N; i++) cnt2[comp[i] + 1]++;
    for (let i = 0; i < n2; i++) cnt2[i+1] += cnt2[i];
    const start = cnt2.slice(), list = new Int32Array(N), fillp = cnt2.slice(0, n2);
    const avg = Array.from({ length: n2 }, () => [0, 0, 0]);
    for (let i = 0; i < N; i++){ const k = comp[i]; list[fillp[k]++] = i; const p = i*4; avg[k][0] += orig[p]; avg[k][1] += orig[p+1]; avg[k][2] += orig[p+2]; }
    const photo = avg.map((a, k) => { const n = start[k+1] - start[k]; return `rgb(${Math.round(a[0]/n)},${Math.round(a[1]/n)},${Math.round(a[2]/n)})`; });
    const edge = new Uint8Array(N);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      const i = y*w + x, k = comp[i];
      if ((x < w-1 && comp[i+1] !== k) || (y < h-1 && comp[i+w] !== k)) edge[i] = 1;
    }
    // 쉬운 단계는 선을 굵게
    if (level === 1){ const e2 = edge.slice(); for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++){ const i = y*w + x; if (edge[i]) { e2[i+1] = 1; e2[i+w] = 1; } } edge.set(e2); }

    const out = document.createElement('canvas'); out.width = w; out.height = h;
    const og = out.getContext('2d');
    const image = og.createImageData(w, h);
    P = { img, dataURL, level, w, h, comp, start, list, photo, edge, n: n2, out, og, image, fills: new Map(), undo: [] };
    if (saved) for (const [k, col] of saved.fills) if (k < n2) P.fills.set(k, col);
    paintAll();
    layout();
    syncUI();
    save();
  }
  const rgbOf = col => {
    if (col[0] === '#') return [parseInt(col.slice(1, 3), 16), parseInt(col.slice(3, 5), 16), parseInt(col.slice(5, 7), 16)];
    return col.match(/\d+/g).map(Number);
  };
  function paintComp(k){
    const d = P.image.data, col = P.fills.get(k), [r, g, b] = col ? rgbOf(col) : [255, 255, 255];
    for (let j = P.start[k]; j < P.start[k+1]; j++){
      const i = P.list[j], p = i*4;
      if (P.edge[i]){ d[p] = 60; d[p+1] = 60; d[p+2] = 60; }
      else { d[p] = r; d[p+1] = g; d[p+2] = b; }
      d[p+3] = 255;
    }
  }
  function paintAll(){ for (let k = 0; k < P.n; k++) paintComp(k); P.og.putImageData(P.image, 0, 0); draw(); }

  // ---------- 그리기 ----------
  let W = 0, H = 0, S = 1, OX = 0, OY = 0, dpr = 1;
  function layout(){
    W = stage.clientWidth; H = stage.clientHeight;
    const pw = Math.round(Math.min(230, Math.max(170, W*.17)));
    stage.style.setProperty('--pw', pw + 'px');
    const aw = W - pw;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(aw*dpr); cv.height = Math.round(H*dpr);
    cv.style.width = aw + 'px'; cv.style.height = H + 'px';
    if (P){ S = Math.min((aw - 20)/P.w, (H - 20)/P.h); OX = (aw - P.w*S)/2; OY = (H - P.h*S)/2; }
    draw();
  }
  function draw(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#1F2A3C'; ctx.fillRect(0, 0, W, H);
    if (!P) return;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(OX + 4, OY + 6, P.w*S, P.h*S);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(P.out, OX, OY, P.w*S, P.h*S);
  }

  // ---------- 칠하기 ----------
  cv.addEventListener('pointerdown', e => {
    if (!P) return;
    wakeAudio();
    const r = cv.getBoundingClientRect();
    const sx = turned.matches ? e.clientY - r.top : e.clientX - r.left;
    const sy = turned.matches ? r.right - e.clientX : e.clientY - r.top;
    const x = Math.floor((sx - OX)/S), y = Math.floor((sy - OY)/S);
    if (x < 0 || y < 0 || x >= P.w || y >= P.h) return;
    const k = P.comp[y*P.w + x];
    const col = brush === 'photo' ? P.photo[k] : brush === 'erase' ? null : brush;
    const prev = P.fills.get(k) || null;
    if (prev === col) return;
    P.undo.push([k, prev]);
    if (col) P.fills.set(k, col); else P.fills.delete(k);
    paintComp(k); P.og.putImageData(P.image, 0, 0); draw();
    beep(col ? 660 : 330, .06);
    syncUI(); save();
  });
  $('#undo').addEventListener('click', () => {
    if (!P || !P.undo.length) return;
    const [k, prev] = P.undo.pop();
    if (prev) P.fills.set(k, prev); else P.fills.delete(k);
    paintComp(k); P.og.putImageData(P.image, 0, 0); draw(); syncUI(); save();
  });
  function syncUI(){
    if (!P) return;
    let a = 0; for (const k of P.fills.keys()) a += P.start[k+1] - P.start[k];
    $('#pct').textContent = Math.round(a/(P.w*P.h)*100) + '%';
    $('#undo').disabled = !P.undo.length;
    const pv = $('#pv'); pv.width = 480; pv.height = Math.round(480*P.h/P.w);
    pv.getContext('2d').drawImage(P.img, 0, 0, pv.width, pv.height);
    for (const b of $('#level').querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', +b.dataset.v === P.level ? 'true' : 'false');
  }
  function buildSwatches(){
    const sw = $('#sw');
    const all = COLORS.map(c => ({ v: c, html: '', label: '물감', style: `background:${c}` }))
      .concat([{ v: 'photo', cls: 'photo', label: '원래 사진 색' }, { v: 'erase', cls: 'eraser', html: '지우개', label: '지우개' }]);
    for (const s of all){
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.v = s.v; b.className = s.cls || ''; b.setAttribute('aria-label', s.label);
      if (s.style) b.style.cssText = s.style;
      b.innerHTML = s.html || '';
      sw.appendChild(b);
    }
    syncBrush();
  }
  function syncBrush(){ for (const b of $('#sw').children) b.setAttribute('aria-pressed', b.dataset.v === brush ? 'true' : 'false'); }
  $('#sw').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; brush = b.dataset.v; syncBrush(); wakeAudio(); beep(520, .04); });

  // ---------- 사진 준비 ----------
  function fit(im, max){
    const s = Math.min(1, max / Math.max(im.naturalWidth || im.width, im.naturalHeight || im.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round((im.naturalWidth || im.width)*s));
    c.height = Math.max(1, Math.round((im.naturalHeight || im.height)*s));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    return c;
  }
  // 그림판은 항상 가로 — 세로 사진은 왼쪽으로 눕혀서(사진 위쪽이 판 왼쪽) 태블릿을 세로로 들면 바로 보이게
  function landscape(c){
    if (c.height <= c.width) return c;
    const r = document.createElement('canvas'); r.width = c.height; r.height = c.width;
    const g = r.getContext('2d'); g.translate(0, c.width); g.rotate(-Math.PI/2); g.drawImage(c, 0, 0);
    return r;
  }
  const loadImg = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
  // 저장해 둔 그림과 칸이 똑같이 나오도록, JPEG로 한 번 저장한 그림으로 칸을 나눈다
  async function newPicture(canvas, level, saved){
    $('#busy').hidden = false; $('#menu').hidden = true;
    await new Promise(r => setTimeout(r, 30));
    try {
      const url = saved ? saved.img : landscape(fit(canvas, WORK)).toDataURL('image/jpeg', .9);
      const im = await loadImg(url);
      build(fit(im, WORK), level, url, saved);
    } catch(e){ toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'); }
    $('#busy').hidden = true;
  }
  function save(){
    if (!P) return;
    if (!store.set(KEY, JSON.stringify({ v: 1, img: P.dataURL, level: P.level, fills: [...P.fills] }))) toast('저장 공간이 부족해 칠한 것을 기억하지 못해요.');
  }
  function sampleImage(){
    const w = 1200, h = 800, c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = '#9EC5DE'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#F2C230'; g.beginPath(); g.arc(1000, 150, 80, 0, Math.PI*2); g.fill();
    g.fillStyle = '#5E7F95'; g.beginPath(); g.moveTo(0, 520); g.lineTo(380, 230); g.lineTo(700, 520); g.fill();
    g.fillStyle = '#76A95A'; g.fillRect(0, 520, w, 280);
    g.fillStyle = '#E9E2D0'; g.fillRect(620, 420, 280, 200);
    g.fillStyle = '#B8452F'; g.beginPath(); g.moveTo(590, 430); g.lineTo(760, 300); g.lineTo(930, 430); g.fill();
    g.fillStyle = '#5B3A22'; g.fillRect(730, 500, 60, 120);
    g.fillStyle = '#7FB3D6'; g.fillRect(650, 460, 60, 50); g.fillRect(810, 460, 60, 50);
    for (const [x, col] of [[150, '#E53935'], [260, '#F48FB1'], [370, '#FDD835'], [480, '#8E44AD']]){
      g.fillStyle = '#2E7D32'; g.fillRect(x - 4, 640, 8, 90);
      g.fillStyle = col; for (let a = 0; a < 5; a++){ g.beginPath(); g.arc(x + Math.cos(a*1.256)*26, 630 + Math.sin(a*1.256)*26, 20, 0, Math.PI*2); g.fill(); }
      g.fillStyle = '#FB8C00'; g.beginPath(); g.arc(x, 630, 16, 0, Math.PI*2); g.fill();
    }
    g.fillStyle = '#fff'; for (const [x, y] of [[220, 120], [520, 90]]){ g.beginPath(); g.ellipse(x, y, 90, 40, 0, 0, Math.PI*2); g.fill(); }
    return c;
  }

  // ---------- 다른 게임에 넣어 둔 사진 빌려 쓰기 ----------
  // 같은 주소(github.io)의 사진 퍼즐·숨은그림·틀린그림·짝 맞추기가 기기에 저장한 사진
  const SHARED = ['jigsaw', 'hidden', 'diff', 'pairs'];
  async function otherDb(name){
    if (!indexedDB.databases) return null;
    const list = await indexedDB.databases();
    if (!list.some(d => d.name === name)) return null; // 없는 이름을 열면 빈 저장소가 생겨 그 앱이 망가진다
    return new Promise(ok => {
      try {
        const rq = indexedDB.open(name);
        rq.onsuccess = () => { const d = rq.result; if (d.objectStoreNames.contains('photos')) ok(d); else { d.close(); ok(null); } };
        rq.onerror = () => ok(null);
      } catch(e){ ok(null); }
    });
  }
  const req = (d, fn) => new Promise((ok, no) => { const tx = d.transaction('photos', 'readonly'), r = fn(tx.objectStore('photos')); tx.oncomplete = () => ok(r.result); tx.onerror = () => no(tx.error); });
  async function borrowedPhoto(){
    const all = [];
    for (const name of SHARED){
      try { const d = await otherDb(name); if (!d) continue; const ks = await req(d, st => st.getAllKeys()); ks.forEach(k => all.push([d, k])); } catch(e){}
    }
    if (!all.length) return null;
    const [d, k] = all[Math.floor(Math.random()*all.length)];
    const blob = await req(d, st => st.get(k));
    const url = URL.createObjectURL(blob);
    try { return await loadImg(url); } finally { URL.revokeObjectURL(url); }
  }
  async function nextPhoto(quiet){
    const im = await borrowedPhoto().catch(() => null);
    if (!im){ if (quiet !== true) toast('다른 게임에 넣어 둔 사진이 없어요. 「사진 고르기」로 골라 주세요.'); return false; }
    await newPicture(im, prefs.level);
    return true;
  }

  // ---------- 소리·알림 ----------
  let ac = null;
  function wakeAudio(){
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){}
  }
  function beep(freq, dur){
    if (!prefs.sound || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.18, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch(e){}
  }
  let toastT = 0;
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }

  // ---------- 설정 ----------
  const toggle = (btn, on) => btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  $('#file').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const url = URL.createObjectURL(f);
    try { await newPicture(await loadImg(url), prefs.level); } catch(err){ toast('이 파일은 열 수 없어요. 사진(JPG·PNG) 파일을 골라 주세요.'); }
    URL.revokeObjectURL(url);
  });
  $('#next').addEventListener('click', nextPhoto);
  $('#level').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || !P || +b.dataset.v === P.level) return;
    prefs.level = +b.dataset.v; savePrefs();
    loadImg(P.dataURL).then(im => newPicture(im, prefs.level));
  });
  let clrArm = 0;
  $('#clear').addEventListener('click', e => {
    const b = e.currentTarget;
    if (!P) return;
    if (b.dataset.armed !== '1' && P.fills.size){ b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 지워요'; clearTimeout(clrArm); clrArm = setTimeout(() => { b.dataset.armed = '0'; b.textContent = '처음부터'; }, 2600); return; }
    b.dataset.armed = '0'; b.textContent = '처음부터';
    P.fills.clear(); P.undo = []; paintAll(); syncUI(); save(); $('#menu').hidden = true;
  });
  $('#save').addEventListener('click', () => {
    if (!P) return;
    const a = document.createElement('a');
    a.href = P.out.toDataURL('image/png'); a.download = '색칠그림_' + new Date().toISOString().slice(0, 10) + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    toast('그림을 저장했어요. 갤러리의 「Download」에서 볼 수 있어요.');
  });
  $('#peek').addEventListener('click', e => { const on = $('#peekBox').hidden; $('#peekBox').hidden = !on; toggle(e.currentTarget, on); });
  $('#sound').addEventListener('click', e => { prefs.sound = !prefs.sound; savePrefs(); toggle(e.currentTarget, prefs.sound); if (prefs.sound){ wakeAudio(); beep(660, .08); } });
  $('#gear').addEventListener('click', () => { $('#menu').hidden = false; });
  $('#menuClose').addEventListener('click', () => { $('#menu').hidden = true; });
  const fullBtn = $('#full'), fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener('click', () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => {}); }
    } catch(e){}
    $('#menu').hidden = true;
  });

  // ---------- 시작 ----------
  async function boot(){
    buildSwatches(); toggle($('#sound'), prefs.sound);
    layout();
    let st = null;
    try { st = JSON.parse(store.get(KEY) || 'null'); } catch(e){}
    if (st && st.v === 1 && st.img && LEVELS[st.level]){ await newPicture(null, st.level, st); return; }
    // 처음이면 다른 게임에 넣어 둔 내 사진으로, 없으면 기본 그림으로
    if (!(await nextPhoto(true).catch(() => false))) await newPicture(sampleImage(), prefs.level);
  }
  new ResizeObserver(layout).observe(stage);
  boot();
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
